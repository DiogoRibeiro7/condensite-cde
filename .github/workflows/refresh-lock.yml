name: Refresh Poetry lock

on:
  workflow_dispatch:
  push:
    branches: ["condensite-hardening-review"]
    paths:
      - "pyproject.toml"
      - ".github/workflows/refresh-lock.yml"

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: condensite-hardening-review
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: pip install poetry==2.2.1
      - name: Refresh lockfile
        run: poetry lock
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- poetry.lock; then
            echo "poetry.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add poetry.lock
          git commit -m "chore: refresh poetry lock"
          git push origin HEAD:condensite-hardening-review
