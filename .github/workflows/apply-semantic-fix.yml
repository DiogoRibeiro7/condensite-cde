name: Apply semantic estimator fix

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply_semantic_fix.py
      - .github/workflows/apply-semantic-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/train-only-validation-tail-es
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: pip install poetry==2.2.1
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Apply patch
        run: poetry run python scripts/apply_semantic_fix.py
      - name: Tighten typing and leakage regression
        run: |
          poetry run python - <<'PY'
          from pathlib import Path

          estimator_path = Path("src/condensite_torch/estimator.py")
          estimator_text = estimator_path.read_text(encoding="utf-8")
          old_call = "            self._transform_with_preprocessor(X_val_eval)\n"
          new_call = (
              "            self._transform_with_preprocessor(\n"
              "                np.asarray(X_val_eval, dtype=object),\n"
              "            )\n"
          )
          if old_call not in estimator_text:
              raise RuntimeError("Expected validation transform call not found")
          estimator_path.write_text(
              estimator_text.replace(old_call, new_call, 1),
              encoding="utf-8",
          )

          test_path = Path("tests/unit/test_reviewer_estimator_fixes.py")
          test_text = test_path.read_text(encoding="utf-8")
          marker = "def test_internal_validation_split_fits_scalers_on_training_rows_only() -> None:\n"
          if marker not in test_text:
              raise RuntimeError("Expected leakage regression not found")
          prefix = test_text[: test_text.index(marker)]
          stronger_test = '''def test_internal_validation_split_fits_preprocessing_on_training_rows_only() -> None:
              y = np.linspace(0.0, 9.0, 10)
              config = CondensiteTorchCDEConfig(
                  hidden_sizes=(4,),
                  epochs=1,
                  patience=1,
                  batch_size=4,
                  m_aux=4,
                  val_fraction=0.2,
              )
              probe = CondensiteTorchCDE(config=config, random_seed=3)
              train_idx, val_idx = probe._train_val_indices(len(y))
              assert val_idx is not None

              X = np.empty((10, 2), dtype=object)
              X[:, 0] = np.arange(10, dtype=np.float64)
              X[:, 1] = "train"
              X[val_idx, 1] = "heldout-only"

              estimator = CondensiteTorchCDE(config=config, random_seed=3)
              estimator.fit(X, y)

              assert estimator.preprocessor is not None
              categories = estimator.preprocessor.categorical_categories_[1]
              assert "heldout-only" not in categories
              assert "__unknown__" in categories
              assert estimator.x_scaler is not None
              train_numeric = np.asarray(X[train_idx, 0], dtype=np.float64)
              assert estimator.x_scaler.mean_[0] == pytest.approx(float(train_numeric.mean()))
              assert estimator.y_scaler is not None
              assert estimator._y_train is not None
              assert estimator.y_scaler.min_ == pytest.approx(float(y[train_idx].min()))
              assert estimator.y_scaler.max_ == pytest.approx(float(y[train_idx].max()))
              np.testing.assert_array_equal(np.sort(estimator._y_train), np.sort(y[train_idx]))
              assert not np.any(np.isin(y[val_idx], estimator._y_train))
          '''
          test_path.write_text(prefix + stronger_test, encoding="utf-8")
          PY
      - name: Remove temporary patch files
        run: |
          rm scripts/apply_semantic_fix.py
          rm .github/workflows/apply-semantic-fix.yml
      - name: Validate final tree
        run: |
          poetry run ruff format .
          poetry run ruff check .
          poetry run mypy
          poetry run pytest -q
      - name: Commit final tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: isolate validation preprocessing and tail ES semantics"
          git push origin HEAD:fix/train-only-validation-tail-es
