name: Apply semantic estimator fix

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply_semantic_fix.py
      - .github/workflows/apply-semantic-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: repair/semantic-fix-after-16
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: pip install poetry==2.2.1
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Apply semantic repair
        run: poetry run python scripts/apply_semantic_fix.py
      - name: Align mixed-feature annotations
        run: |
          poetry run python - <<'PY'
          from pathlib import Path

          path = Path("src/condensite_torch/estimator.py")
          text = path.read_text(encoding="utf-8")
          old_internal = (
              "    def _predict_density_internal(  # noqa: PLR0914\n"
              "        self,\n"
              "        X: NDArray[np.floating],\n"
          )
          new_internal = (
              "    def _predict_density_internal(  # noqa: PLR0914\n"
              "        self,\n"
              "        X: NDArray[np.object_] | NDArray[np.floating],\n"
          )
          old_best = (
              "    def _determine_best_head(\n"
              "        self,\n"
              "        val_eval_data: tuple[NDArray[np.float64], NDArray[np.float64]] | None,\n"
          )
          new_best = (
              "    def _determine_best_head(\n"
              "        self,\n"
              "        val_eval_data: tuple[\n"
              "            NDArray[np.object_] | NDArray[np.floating],\n"
              "            NDArray[np.float64],\n"
              "        ]\n"
              "        | None,\n"
          )
          if old_internal not in text:
              raise RuntimeError("Expected internal density signature not found")
          if old_best not in text:
              raise RuntimeError("Expected best-head signature not found")
          text = text.replace(old_internal, new_internal, 1)
          text = text.replace(old_best, new_best, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Normalize generated imports
        run: poetry run ruff check --fix tests/test_condensite_cde.py
      - name: Remove temporary patch files
        run: |
          rm scripts/apply_semantic_fix.py
          rm .github/workflows/apply-semantic-fix.yml
      - name: Validate final tree
        run: |
          poetry run ruff format .
          poetry run ruff check .
          poetry run mypy
          poetry run pytest -q
      - name: Commit final tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: complete semantic estimator repair"
          git push origin HEAD:repair/semantic-fix-after-16
