name: Generate final review fixes

on:
  push:
    branches:
      - ci-review-cleanup-final
    paths:
      - scripts/apply_final_review_fixes.py
      - .github/workflows/apply-final-review-fixes.yml

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ci-review-cleanup-final
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: pip install poetry==2.2.1
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Normalize applicator replacement cardinality
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/apply_final_review_fixes.py")
          text = path.read_text(encoding="utf-8")
          old = '    _replace(path, "np.trapezoid", "np.trapz")\n'
          new = (
              '    target = Path(path)\n'
              '    text = target.read_text(encoding="utf-8")\n'
              '    target.write_text(text.replace("np.trapezoid", "np.trapz"), encoding="utf-8")\n'
          )
          if old not in text:
              raise RuntimeError("Expected trapezoid replacement call was not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Generate source and test fixes
        run: python scripts/apply_final_review_fixes.py
      - name: Finish target-range cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/condensite_torch/estimator.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "        y_min = float(np.min(y)) if y.size else None\n"
              "        y_max = float(np.max(y)) if y.size else None\n",
              "",
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY
      - name: Remove scaffolding from generated tree
        run: |
          rm scripts/apply_final_review_fixes.py
          rm .github/workflows/apply-final-review-fixes.yml
      - name: Format and lint generated tree
        run: |
          poetry run ruff format .
          poetry run ruff check .
      - name: Package generated files
        run: |
          tar -czf /tmp/final-review-files.tar.gz \
            scripts/monitor_report.py \
            src/condensite_cde/adapters.py \
            src/condensite_cde/cv.py \
            src/condensite_cde/reports.py \
            src/condensite_cde/tune.py \
            src/condensite_torch/datasets.py \
            src/condensite_torch/distribution_metrics.py \
            src/condensite_torch/ensemble.py \
            src/condensite_torch/estimator.py \
            src/condensite_torch/metrics.py \
            src/condensite_torch/monitoring.py \
            tests/test_adapters.py \
            tests/test_cross_validation.py \
            tests/test_metrics.py \
            tests/unit/test_metrics.py \
            tests/unit/test_monitoring.py \
            tests/unit/test_reports.py \
            tests/unit/test_reviewer_estimator_fixes.py
      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: final-review-files
          path: /tmp/final-review-files.tar.gz
      - name: Type check generated tree
        run: poetry run mypy
      - name: Full tests
        if: always()
        run: poetry run pytest -q
