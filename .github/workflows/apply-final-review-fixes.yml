name: Finalize review fixes

on:
  push:
    branches:
      - ci-review-cleanup-final
    paths:
      - scripts/finalize_review.py
      - .github/workflows/apply-final-review-fixes.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ci-review-cleanup-final
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: pip install poetry==2.2.1
      - name: Install dependencies with retry
        run: |
          for attempt in 1 2 3; do
            if poetry install --no-interaction; then
              exit 0
            fi
            echo "Dependency install attempt ${attempt} failed"
            sleep 10
          done
          exit 1
      - name: Apply final fixes
        run: poetry run python scripts/finalize_review.py
      - name: Remove temporary scaffolding
        run: |
          rm scripts/apply_final_review_fixes.py
          rm scripts/finalize_review.py
          rm .github/workflows/apply-final-review-fixes.yml
      - name: Validate final tree
        run: |
          poetry run ruff format .
          poetry run ruff check .
          poetry run mypy
          poetry run pytest -q
      - name: Commit validated final tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: resolve final review and validation findings"
          git push origin HEAD:ci-review-cleanup-final
