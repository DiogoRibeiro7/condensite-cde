name: Bug Report
about: Report a reproducible problem in condensite-torch
labels: bug
body:
  - type: markdown
    attributes:
      value: Thank you for helping improve Condensite Torch!
  - type: input
    id: summary
    attributes:
      label: Summary
      description: What happened?
      placeholder: Short description
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps To Reproduce
      description: Include code snippets, commands, or configuration.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: e.g. condensite-torch version, Python, OS.
