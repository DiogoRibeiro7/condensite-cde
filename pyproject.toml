[project]
name = "condensite-cde"
version = "0.1.0"
description = "PyTorch tabular conditional density estimator."
authors = [
    { name = "Condensite Contributors", email = "opensource@condensite.ai" },
    { name = "Diogo Ribeiro", email = "dfr@esmad.ipp.pt" },
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10,<3.13"
keywords = ["pytorch", "conditional-density", "tabular", "bayesian", "deep-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch (>=2.5,<2.6)",
    "numpy (>=1.26,<3.0.0)",
]

[project.urls]
Homepage = "https://github.com/diogoribeiro7/condensite-cde"
Repository = "https://github.com/diogoribeiro7/condensite-cde"
Documentation = "https://github.com/diogoribeiro7/condensite-cde#readme"
Issues = "https://github.com/diogoribeiro7/condensite-cde/issues"

[project.scripts]
condensite = "condensite_torch.cli:main"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "ruff (>=0.14.10,<0.15.0)",
    "mypy (>=1.19.1,<2.0.0)",
    "jsonschema (>=4.23.0,<5.0.0)",
]

[tool.poetry]
packages = [
    { include = "condensite_torch", from = "src" },
    { include = "condensite_cde", from = "src" },
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "S", "PL", "RUF"]
ignore = ["ANN401", "S101"]
preview = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true
preview = true

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = ["src"]
packages = ["condensite_torch", "condensite_cde"]
warn_unused_configs = true
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "unit: fast, hermetic unit tests",
  "integration: end-to-end flows on CPU",
  "regression: snapshot/regression coverage tests",
  "slow: long-running tests gated in CI",
]
