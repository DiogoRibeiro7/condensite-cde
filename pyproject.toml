[project]
name = "condensite-torch"
version = "0.1.0"
description = "PyTorch tabular conditional density estimator."
authors = [
    { name = "Condensite Contributors", email = "opensource@condensite.ai" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch (>=2.9.1,<3.0.0)",
    "numpy (>=2.4.0,<3.0.0)",
]

[project.urls]
Homepage = "https://github.com/condensite/condensite-torch"
Documentation = "https://github.com/condensite/condensite-torch"
Issues = "https://github.com/condensite/condensite-torch/issues"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "ruff (>=0.14.10,<0.15.0)",
    "mypy (>=1.19.1,<2.0.0)",
]

[tool.poetry]
packages = [
    { include = "condensite_torch", from = "src" },
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "S", "PL", "RUF"]
ignore = ["ANN101", "ANN102", "ANN401", "S101"]
preview = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true
preview = true

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = ["src"]
packages = ["condensite_torch"]
warn_unused_configs = true
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
